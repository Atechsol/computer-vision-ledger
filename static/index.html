<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Watchlist</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1>Credit Watchlist</h1>
  <span id="camPill" class="pill">camera…</span>
  <span id="wsPill" class="pill">live…</span>
</header>

<form class="settings" id="settingsForm">
  <label>Min due (₹)<input type="number" name="min_due" min="0" step="100"></label>
  <label>Match threshold<input type="number" name="threshold" min="0" max="1" step="0.01"></label>
  <label>Cooldown (s)<input type="number" name="cooldown" min="0" step="5"></label>
  <label>Confirm N<input type="number" name="confirm_n" min="1" max="20"></label>
  <label>of last M frames<input type="number" name="confirm_m" min="1" max="20"></label>
  <div class="save"><button class="primary" type="submit">Save</button><span id="settingsMsg" class="msg"></span></div>
</form>

<main>
  <section>
    <div class="card">
      <h2>Live camera</h2>
      <img id="video" src="/video" alt="Live camera feed">
      <p class="hint">
        Box colours: <b style="color:var(--red)">red</b> = enrolled &amp; owes,
        <b style="color:var(--green)">green</b> = enrolled, no dues, <b>grey</b> = unknown.
      </p>
    </div>
    <div class="card">
      <h2>Recent alerts</h2>
      <div class="tablewrap"><table><tbody id="alertRows"></tbody></table></div>
      <div id="alertEmpty" class="empty">No alerts yet</div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2>Buyers</h2>
      <button class="primary" id="addBuyerBtn">+ Add buyer</button>
    </div>
    <div class="tablewrap">
      <table id="buyersTable">
        <thead><tr><th>Name</th><th class="num">Outstanding</th><th>Status</th><th></th></tr></thead>
        <tbody id="buyerRows"></tbody>
      </table>
    </div>
    <div id="buyerEmpty" class="empty">No buyers yet — add one with a photo</div>
  </section>
</main>
</div>

<!-- Add buyer -->
<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2 style="margin:0">Add buyer</h2>
    <label>Name<input name="name" required maxlength="100"></label>
    <label>Phone (optional)<input name="phone" maxlength="30"></label>
    <label>Opening credit (₹)<input name="opening_credit" type="number" min="0" step="1" value="0"></label>
    <label>Face photo(s) — clear, front-facing, one person per photo
      <input name="photos" type="file" accept="image/*" multiple required></label>
    <div class="msg" id="addMsg"></div>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Add &amp; enroll</button></div>
  </form>
</dialog>

<!-- Enroll more photos -->
<dialog id="enrollDlg">
  <form id="enrollForm" method="dialog">
    <h2 style="margin:0" id="enrollTitle">Enroll photos</h2>
    <label>More photos (different angle / glasses on or off help)
      <input name="photos" type="file" accept="image/*" multiple required></label>
    <div class="msg" id="enrollMsg"></div>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Enroll</button></div>
  </form>
</dialog>

<!-- Ledger entry -->
<dialog id="ledgerDlg">
  <form id="ledgerForm" method="dialog">
    <h2 style="margin:0" id="ledgerTitle">Ledger entry</h2>
    <label>Type<select name="kind"><option value="payment">Payment received</option><option value="credit">Credit given</option></select></label>
    <label>Amount (₹)<input name="amount" type="number" min="1" step="1" required></label>
    <label>Note (optional)<input name="note" maxlength="200"></label>
    <div class="msg" id="ledgerMsg"></div>
    <div class="actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>
</dialog>

<!-- Alert notification -->
<dialog id="alertDlg">
  <h2>⚠ Credit buyer detected</h2>
  <div class="who" id="aName"></div>
  <div class="due" id="aDue"></div>
  <div class="sub" id="aMeta"></div>
  <div class="faces">
    <figure><img id="aEnrolled" alt="Enrolled photo"><figcaption>Enrolled photo</figcaption></figure>
    <figure><img id="aSnap" alt="Camera snapshot"><figcaption>Camera snapshot</figcaption></figure>
  </div>
  <button class="primary bigbtn" id="ackBtn">Acknowledge</button>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 });
const fmtTime = (ts) => new Date(ts * 1000).toLocaleString();
const photoUrl = (p) => (p ? "/photos/" + p : "");
let settings = {}, buyers = [];

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids) e.append(kid);
  return e;
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let d = r.statusText;
    try { const j = await r.json(); d = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch {}
    throw new Error(d);
  }
  return r.json();
}
const postJSON = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function filesForm(input) {
  const fd = new FormData();
  for (const f of input.files) fd.append("photos", f);
  return fd;
}

/* ---------- dialogs ---------- */
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));

/* ---------- settings ---------- */
async function loadSettings() {
  settings = await api("/settings");
  for (const [k, v] of Object.entries(settings)) { const i = document.querySelector(`#settingsForm [name=${k}]`); if (i) i.value = v; }
}
$("#settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try { settings = await postJSON("/settings", body); $("#settingsMsg").textContent = "Saved"; loadBuyers(); }
  catch (err) { $("#settingsMsg").textContent = err.message; }
  setTimeout(() => ($("#settingsMsg").textContent = ""), 2500);
});

/* ---------- buyers ---------- */
async function loadBuyers() {
  buyers = await api("/buyers");
  const rows = $("#buyerRows");
  rows.replaceChildren();
  $("#buyerEmpty").style.display = buyers.length ? "none" : "block";
  for (const b of buyers) {
    const watch = b.outstanding > settings.min_due;
    const status = b.n_embeddings === 0 ? el("span", { class: "tag noface" }, "no face enrolled")
      : watch ? el("span", { class: "tag watch" }, "on watchlist") : el("span", { class: "tag clear" }, "clear");
    const nameCell = el("td", {});
    if (b.photo_path) nameCell.append(el("img", { class: "thumb", src: photoUrl(b.photo_path), alt: "" }));
    nameCell.append(b.name);
    if (b.phone) nameCell.append(el("div", { class: "sub", style: "margin-left:46px" }, b.phone));
    rows.append(el("tr", {},
      nameCell,
      el("td", { class: "num" }, inr.format(b.outstanding)),
      el("td", {}, status),
      el("td", {}, el("div", { class: "row-actions" },
        el("button", { class: "sm", onclick: () => openEnroll(b) }, "Enroll"),
        el("button", { class: "sm", onclick: () => openLedger(b) }, "Ledger"),
        el("button", { class: "sm danger", title: "Delete buyer and face data", onclick: () => delBuyer(b) }, "✕")))));
  }
}

$("#addBuyerBtn").addEventListener("click", () => { $("#addForm").reset(); $("#addMsg").textContent = ""; $("#addDlg").showModal(); });
$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, msg = $("#addMsg");
  msg.textContent = "Saving…";
  let buyer;
  try {
    buyer = await postJSON("/buyers", { name: f.name.value, phone: f.phone.value, opening_credit: Number(f.opening_credit.value || 0) });
    const res = await api(`/buyers/${buyer.id}/enroll`, { method: "POST", body: filesForm(f.photos) });
    if (res.enrolled === 0) {
      msg.textContent = `Buyer saved, but no usable face:\n${res.errors.join("\n")}\nUse "Enroll" on the row to try another photo.`;
      loadBuyers(); return;
    }
    $("#addDlg").close();
  } catch (err) { msg.textContent = err.message; if (buyer) loadBuyers(); return; }
  loadBuyers();
});

let enrollTarget = null;
function openEnroll(b) { enrollTarget = b; $("#enrollTitle").textContent = "Enroll photos — " + b.name; $("#enrollForm").reset(); $("#enrollMsg").textContent = ""; $("#enrollDlg").showModal(); }
$("#enrollForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#enrollMsg").textContent = "Processing…";
  try {
    const res = await api(`/buyers/${enrollTarget.id}/enroll`, { method: "POST", body: filesForm(e.target.photos) });
    if (res.errors.length) { $("#enrollMsg").textContent = `Enrolled ${res.enrolled}.\n${res.errors.join("\n")}`; }
    else $("#enrollDlg").close();
    loadBuyers();
  } catch (err) { $("#enrollMsg").textContent = err.message; }
});

let ledgerTarget = null;
function openLedger(b) { ledgerTarget = b; $("#ledgerTitle").textContent = `${b.name} — owes ${inr.format(b.outstanding)}`; $("#ledgerForm").reset(); $("#ledgerMsg").textContent = ""; $("#ledgerDlg").showModal(); }
$("#ledgerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    await postJSON(`/buyers/${ledgerTarget.id}/ledger`, { kind: f.kind.value, amount: Number(f.amount.value), note: f.note.value });
    $("#ledgerDlg").close(); loadBuyers();
  } catch (err) { $("#ledgerMsg").textContent = err.message; }
});

async function delBuyer(b) {
  if (!confirm(`Delete ${b.name}, their ledger and face data?`)) return;
  await api(`/buyers/${b.id}`, { method: "DELETE" });
  loadBuyers(); loadAlerts();
}

/* ---------- alerts ---------- */
async function loadAlerts() {
  const list = await api("/alerts?limit=15");
  const rows = $("#alertRows");
  rows.replaceChildren();
  $("#alertEmpty").style.display = list.length ? "none" : "block";
  for (const a of list) {
    rows.append(el("tr", {},
      el("td", {}, a.name),
      el("td", { class: "num" }, inr.format(a.outstanding)),
      el("td", {}, fmtTime(a.ts)),
      el("td", {}, a.acknowledged ? el("span", { class: "tag clear" }, "handled") : el("button", { class: "sm", onclick: () => showAlert(a) }, "Review"))));
  }
}

const queue = [];
let current = null;
function showAlert(a) {
  if (current?.id === a.id || queue.some((q) => q.id === a.id)) return;
  queue.push(a); next();
}
function next() {
  if (current || !queue.length) return;
  current = queue.shift();
  $("#aName").textContent = current.name + (current.phone ? " · " + current.phone : "");
  $("#aDue").textContent = inr.format(current.outstanding) + " due";
  $("#aMeta").textContent = `${fmtTime(current.ts)} · match ${current.score.toFixed(2)}`;
  $("#aEnrolled").src = photoUrl(current.photo_path);
  $("#aSnap").src = photoUrl(current.snapshot_path);
  if (!$("#alertDlg").open) $("#alertDlg").showModal();
}
$("#ackBtn").addEventListener("click", async () => {
  const id = current.id;
  try { await api(`/alerts/${id}/ack`, { method: "POST" }); } catch {}
  current = null; $("#alertDlg").close(); loadAlerts(); next();
});
$("#alertDlg").addEventListener("cancel", (e) => e.preventDefault()); // must acknowledge

/* ---------- live socket + status ---------- */
function connectWS() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("#wsPill").textContent = "live ✓"; $("#wsPill").className = "pill ok"; };
  ws.onmessage = (m) => { const d = JSON.parse(m.data); if (d.type === "alert") { showAlert(d.alert); loadAlerts(); } };
  ws.onclose = () => { $("#wsPill").textContent = "reconnecting…"; $("#wsPill").className = "pill bad"; setTimeout(connectWS, 1500); };
  const t = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); else clearInterval(t); }, 20000);
}

async function pollStatus() {
  try {
    const s = await api("/status");
    $("#camPill").textContent = s.camera ? `camera ✓ ${s.fps} fps` : "camera unavailable";
    $("#camPill").className = "pill " + (s.camera ? "ok" : "bad");
  } catch { $("#camPill").textContent = "server offline"; $("#camPill").className = "pill bad"; }
}

(async () => {
  await loadSettings();
  await Promise.all([loadBuyers(), loadAlerts()]);
  (await api("/alerts?unacked=true&limit=20")).reverse().forEach(showAlert); // pending from before reload
  connectWS();
  pollStatus();
  setInterval(pollStatus, 3000);
  setInterval(loadBuyers, 8000);
})();
</script>
</body>
</html>
